name: Build APK
on:
  workflow_dispatch:
  push:
    paths: ['index.html', '.github/workflows/DbMerge-android.zip']
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: unzip -q .github/workflows/DbMerge-android.zip
      - run: sh DbMerge/fetch-sqljs.sh
      - name: Use index.html from repo root
        run: |
          if [ -f index.html ]; then cp index.html DbMerge/app/src/main/assets/www/index.html; fi
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.7
      - run: gradle assembleDebug --no-daemon
        working-directory: DbMerge
      - uses: actions/upload-artifact@v4
        with:
          name: app-debug
          path: DbMerge/app/build/outputs/apk/debug/app-debug.apk
      - env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create v${{ github.run_number }} DbMerge/app/build/outputs/apk/debug/app-debug.apk --title "APK ${{ github.run_number }}" --notes "debug build"
